    <rect x="1006" y="55" width="48" height="48" rx="12" fill="#f5a0f3"/><text x="1030" y="86">04</text>
    <rect x="1079" y="55" width="48" height="48" rx="12" fill="#8bb9ff"/><text x="1103" y="86">05</text>
