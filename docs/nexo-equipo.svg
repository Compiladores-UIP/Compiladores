  <rect x="1" y="1" width="1198" height="158" rx="26" fill="#101e16" stroke="#31553e"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="36" y="43" fill="#9dbcaa" font-size="12" letter-spacing="2">LAS PERSONAS DETRÁS DEL CÓDIGO</text>
    <text x="34" y="91" fill="#e8f4eb" font-size="34" font-weight="700">Construimos Nexo juntos.</text>
    <text x="36" y="126" fill="#9dbcaa" font-size="17">Cinco grupos. Doce módulos. Una misma web.</text>
