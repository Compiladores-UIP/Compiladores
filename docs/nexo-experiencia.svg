<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 184" role="img" aria-label="Lee a tu ritmo, prueba tu código y entiende cada paso"><title>Tres maneras de aprender en Nexo</title><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="385" height="182" rx="22" fill="#13b9d7"/><rect x="407" y="1" width="385" height="182" rx="22" fill="#ffe022"/><rect x="813" y="1" width="386" height="182" rx="22" fill="#00dc88"/><g fill="#123326"><text x="27" y="39" font-size="12" letter-spacing="2">01 / EXPLORA</text><text x="27" y="86" font-size="29" font-weight="700">Lee a tu ritmo.</text><text x="27" y="127" font-size="16">Una explicación y un ejemplo.</text><text x="27" y="152" font-size="16">Empieza por lo que te interesa.</text><text x="433" y="39" font-size="12" letter-spacing="2">02 / EXPERIMENTA</text><text x="433" y="86" font-size="29" font-weight="700">Hazlo funcionar.</text><text x="433" y="127" font-size="16">Cambia una línea. Ejecuta otra vez.</text><text x="433" y="152" font-size="16">Compara los resultados.</text><text x="839" y="39" font-size="12" letter-spacing="2">03 / CONECTA</text><text x="839" y="86" font-size="29" font-weight="700">Entiende cada paso.</text><text x="839" y="127" font-size="16">Del código fuente a la salida.</text><text x="839" y="152" font-size="16">Sigue el recorrido del compilador.</text></g></g></svg>