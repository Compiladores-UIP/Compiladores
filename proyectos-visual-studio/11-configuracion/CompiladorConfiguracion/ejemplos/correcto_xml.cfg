// Mini-Compilador 11 · Lenguaje de configuración (caso correcto, XML)
FORMATO XML
CONFIG nombre = "Nexo"
CONFIG version = 1.5
CONFIG puerto = 3100
CONFIG activo = verdadero
CONFIG idiomas = ["es", "en"]

SECCION servidor
    CONFIG host = "localhost"
    CONFIG puerto : ENTERO = 8080
    CONFIG tiempo_espera : DECIMAL = 30
    SECCION seguridad
        CONFIG https = falso
        CONFIG puertos_permitidos = [80, 443]
    FINSECCION
FINSECCION

# Los textos admiten \" \\ \n y \t
CONFIG mensaje = "Bienvenido a \"Nexo\""
